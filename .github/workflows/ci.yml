name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# One run per ref; superseding pushes cancel the in-flight job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest

    env:
      # Same dummy creds as the test job — config imports run at lint
      # time via `mypy kis_ict_trader`.
      KIS_APP_KEY: ci-dummy
      KIS_APP_SECRET: ci-dummy
      KIS_ACCOUNT_NO: "12345678"
      KIS_ACCOUNT_PRODUCT_CODE: "01"
      KIS_ENV: vps

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            kis_ict_trader/requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kis_ict_trader/requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (lint + import order)
        run: ruff check .

      - name: Mypy (static types)
        run: mypy kis_ict_trader

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Dummy creds so cfg.validate() passes inside tests.
      # Real credentials live in deploy secrets, never the repo.
      KIS_APP_KEY: ci-dummy
      KIS_APP_SECRET: ci-dummy
      KIS_ACCOUNT_NO: "12345678"
      KIS_ACCOUNT_PRODUCT_CODE: "01"
      KIS_ENV: vps
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MPLBACKEND: Agg

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            kis_ict_trader/requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kis_ict_trader/requirements.txt
          pip install -r requirements-dev.txt

      - name: Show versions
        run: |
          python --version
          pip list | grep -E '^(pytest|pandas|numpy|httpx|matplotlib|mplfinance|APScheduler)'

      - name: Run pytest
        run: python -m pytest -ra

      - name: Summarise (pytest outcome)
        if: always()
        run: |
          echo "Exit status: $?"

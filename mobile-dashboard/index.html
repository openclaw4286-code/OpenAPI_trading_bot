<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0064FF" />

    <!--
      Pretendard Variable from jsDelivr — first item in the design
      system's --font-sans cascade is "Pretendard Variable", and this
      is the canonical web build (single variable font, all weights
      from 45-920) that Toss/Naver/Kakao apps load. Preconnect first
      so the font byte-stream parallelizes with the JS bundle, then
      load the variable-font stylesheet itself.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"
    />

    <title>ICT Trader · 모바일 대시보드</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
